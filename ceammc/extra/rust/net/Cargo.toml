[package]
name = "net_rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bytes = "1.11.1"
rumqttc = { version = "0.22.0", features = ["url"] }
tungstenite = "0.21.0"
url = "2.5.8"
tokio = { version = "1.36", features = ["rt", "rt-multi-thread", "signal", "sync", "fs"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
reqwest = { version = "0.13.2", features =["stream", "multipart", "form"] } 
scraper = "0.19.0"
frankenstein = { version = "0.30.5", features = ["async-http-client"] }  
regex = { version = "1.12.3", default-features = false }
tokio-tungstenite = { version = "0.21.0", features = ["native-tls"] }
futures-util = "0.3.30"
oauth2 = "4.4.2"
nom = "7.1.3"
log = "0.4.29"
env_logger = "0.11.9"
serde_json = "1.0.149"
homedir = "0.3.6"
tempfile = "3.25.0"
symphonia = { version = "0.5.5", features = ["mp3", "aiff"] }
itertools = "0.14.0"
rubato = "0.15.0"
nucleo-matcher = { version = "0.3.1" }
debug-ignore = "1.0.5"

[build-dependencies]
cbindgen = "0.28.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "my_benchmark"
harness = false

