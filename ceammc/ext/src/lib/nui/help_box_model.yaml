name: HelpBox
data:
- name: size
  type: Size
  init: Size(20, 16)
  style: size
- name: border color
  type: HexColor
  init: 0xA0A0A0
  style: color
- name: fill color
  type: HexColor
  init: 0xA0A0A0
  style: color
- name: title color
  type: HexColor
  init: colors::st_text
  style: color
- name: title font size
  type: int
  init: 12
- name: title
  type: std::string
  init: "\"?\""
- name: text width
  type: int
  init: 0
- name: is open
  type: bool
  init: "false"
- name: text lines
  type: std::vector<std::string>
  init: "{}"
