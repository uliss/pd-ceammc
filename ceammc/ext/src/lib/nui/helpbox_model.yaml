name: HelpBox
data:
- name: size
  type: Size
  init: Size(20, 30)
  style: size
- name: border color
  type: HexColor
  init: 0xA0A0A0
  style: color
  view: [create, update]
- name: fill color
  type: HexColor
  init: 0xA0A0A0
  style: color
  view: [create, update]
- name: title color
  type: HexColor
  init: 0xFFFFFF
