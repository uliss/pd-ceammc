name: NumEntry
data:
- name: size
  type: Size
  init: Size(100, 12)
  style: size
- name: value
  type: t_float
  init: 0
- name: digits
  type: int
  init: -1
- name: min
  type: t_float
  init: -std::numeric_limits<t_float>::max()
- name: max
  type: t_float
  init: std::numeric_limits<t_float>::max()
- name: prefix
  type: std::string
  init: {}
- name: suffix
  type: std::string
  init: {}
- name: font
  type: Font
  init: Font()
  style: font
- name: border color
  type: HexColor
  init: colors::st_border
  style: color
- name: fill color
  type: HexColor
  init: colors::st_fill
  style: color
- name: text color
  type: HexColor
  init: colors::st_text
  style: color
- name: curve
  type: t_float
  init: 0
